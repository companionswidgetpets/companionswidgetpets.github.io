<!doctype html>
<!-- The social preview card (1200×630), drawn once per language to public/og/ with
     `npm run og` (tools/og/make-plan.mjs writes the plan from src/i18n/*.ts, then headless
     Chrome draws it via tools/shots.mjs); nothing here is served. The words below are the
     English ones, replaced by setWords() at the foot of the page. -->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: "Plus Jakarta Sans";
    font-weight: 200 800;
    src: url("../../public/fonts/PlusJakartaSans-latin.woff2") format("woff2");
  }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: BlinkMacSystemFont, -apple-system, "Plus Jakarta Sans", system-ui, sans-serif;
    background: linear-gradient(to bottom, #b9d9fb 0%, #e6f2fe 55%, #ffffff 100%);
    color: #0b1220;
    position: relative;
  }
  .copy { position: absolute; left: 72px; top: 96px; width: 600px; }
  .brand { display: flex; align-items: center; gap: 18px; margin-bottom: 44px; }
  .brand img { width: 64px; height: 64px; border-radius: 15px; box-shadow: 0 2px 6px rgba(11,18,32,.15); }
  .brand span { font-weight: 750; font-stretch: 150%; font-size: 30px; letter-spacing: 0.02em; }
  h1 { margin: 0; font-weight: 750; font-stretch: 150%; font-size: 50px; line-height: 1.12; letter-spacing: 0.02em; }
  p { margin: 26px 0 0; font-family: -apple-system, system-ui, sans-serif; font-size: 26px; line-height: 1.35; color: #5b6572; max-width: 520px; }
  .facts { margin-top: 36px; font-size: 20px; color: #8a94a3; }
  .tank {
    position: absolute; right: 72px; top: 86px; width: 420px; height: 458px;
    border-radius: 62px; overflow: hidden;
    background:
      linear-gradient(to bottom, rgba(255,255,255,0) 64%, rgba(255,255,255,.12) 78%, rgba(255,255,255,.45) 90%, rgba(255,255,255,.85) 97%, #fff 100%),
      radial-gradient(290px at 15% 5%, rgba(255,255,255,.28), transparent 100%),
      linear-gradient(to bottom, rgb(128 196 255) 0%, rgb(105 184 250) 25%, rgb(92 176 247) 60%, rgb(99 181 250) 100%);
    box-shadow:
      inset 0 0 15px 20px rgba(13 77 179 / .35),
      inset 0 0 5px 7px rgba(255 255 255 / .55),
      0 30px 60px rgba(20, 60, 120, .18);
  }
  .tank::before {
    content: ""; position: absolute; left: 46px; right: 46px; top: 26px; height: 35px; border-radius: 999px;
    background: rgba(255,255,255,.3); filter: blur(9px);
  }
  .tank::after {
    content: ""; position: absolute; inset: 0; border-radius: inherit; padding: 2px;
    background: linear-gradient(135deg, rgba(255,255,255,.95), rgba(255,255,255,.35) 55%, rgba(255,255,255,.75));
    -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0); -webkit-mask-composite: xor;
  }
  .tank img { position: absolute; }
  .fern-l { left: -14px; bottom: -22px; width: 330px; }
  .fern-r { right: -30px; bottom: -4px; width: 200px; transform: scaleX(-1); }
  .sponge { left: 72px; bottom: 6px; width: 150px; }
  .clown { left: 212px; top: 92px; width: 120px; transform: scaleX(-1); }
  .idol { left: 90px; top: 150px; width: 112px; }
  .tang { left: 230px; top: 258px; width: 104px; }
  .seahorse { left: 300px; top: 150px; width: 96px; transform: scaleX(-1); }
  .bubble { position: absolute; border-radius: 50%; border: 2px solid rgba(255,255,255,.75); background: radial-gradient(circle at 35% 35%, rgba(255,255,255,.6), rgba(255,255,255,.05)); }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand"><img src="../../src/assets/icon/app-icon.png" alt="" /><span>Companions</span></div>
    <h1 id="title">A tiny aquarium on your Home&nbsp;Screen.</h1>
    <p id="text">Your fish swim around right on your widget, all day long.</p>
    <div class="facts" id="facts">Free on the App Store · iPhone, iPad, Mac and Apple Watch</div>
  </div>
  <div class="tank">
    <img class="fern-l" src="../../src/assets/props/ferns.png" alt="" />
    <img class="fern-r" src="../../src/assets/props/ferns.png" alt="" />
    <img class="sponge" src="../../src/assets/props/sponge.png" alt="" />
    <img class="idol" src="../../src/assets/fish/moorish_idol.png" alt="" />
    <img class="clown" src="../../src/assets/fish/clownfish.png" alt="" />
    <img class="tang" src="../../src/assets/fish/regal_tang.png" alt="" />
    <img class="seahorse" src="../../src/assets/fish/seahorse.png" alt="" />
    <i class="bubble" style="left:196px; top:70px; width:10px; height:10px"></i>
    <i class="bubble" style="left:184px; top:48px; width:6px; height:6px"></i>
    <i class="bubble" style="left:342px; top:120px; width:8px; height:8px"></i>
  </div>
  <script>
    /* Puts a language's words on the card. Chinese, Japanese and Korean lines are taller
       and break between phrases; a headline too long for the card at full size is set
       smaller, a step at a time, until the words clear the bottom edge. */
    window.setWords = ({ lang, title, text, facts }) => {
      document.documentElement.lang = lang;
      const h1 = document.getElementById('title');
      h1.innerHTML = title;
      document.getElementById('text').textContent = text;
      document.getElementById('facts').textContent = facts;
      const cjk = /^(ja|ko|zh)/.test(lang);
      if (cjk) {
        h1.style.lineHeight = '1.28';
        h1.style.wordBreak = lang === 'ko' ? 'keep-all' : 'auto-phrase';
        document.getElementById('text').style.wordBreak = lang === 'ko' ? 'keep-all' : 'auto-phrase';
        document.getElementById('text').style.lineHeight = '1.5';
      }
      const copy = document.querySelector('.copy');
      let size = 50;
      while (copy.getBoundingClientRect().bottom > 560 && size > 34) {
        size -= 2;
        h1.style.fontSize = `${size}px`;
      }
      window.cardReport = () => `headline ${size}px, words end at ${Math.round(copy.getBoundingClientRect().bottom)}px of 630`;
    };
    window.cardReport = () => 'og card rendered';
  </script>
</body>
</html>
